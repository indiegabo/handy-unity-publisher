site_name: HGP Documentation
site_description: Documentation for the handy-games-publisher (HGP) application.
site_author: indiegabo
docs_dir: docs-public
exclude_docs: |
  /es/**
  /zh-CN/**
nav:
  - About: index.md
  - Create Projects: create-projects.md
  - Release Processes: release-processes.md
  - Settings and Credentials: settings-and-credentials.md
  - Troubleshooting: troubleshooting.md
  - Specifics:
      - Unity:
          - Building Unity Projects: specifics/unity/building-unity-projects.md
  # Planning section intentionally removed from public docs; planning
  # content lives under `developer-docs/` for internal use.

theme:
  name: material
  logo: assets/images/hgp-avatar.png
  custom_dir: docs-public/theme-overrides
  features:
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    alternate: material/web
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: false
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: HGP Documentation
          site_description: Documentation for the handy-games-publisher (HGP) application.
        - locale: pt-BR
          name: Português Brasileiro
          build: true
          site_name: Documentação do HGP
          site_description: Documentação do aplicativo handy-games-publisher (HGP).
          nav_translations:
            About: Sobre
            Create Projects: Criar Projetos
            Release Processes: Processos de Release
            Settings and Credentials: Configurações e Credenciais
            Troubleshooting: Solução de Problemas
            Specifics: Especificidades
            Unity: Unity
            Building Unity Projects: Compilando Projetos Unity
        - locale: es
          name: Spanish
          build: false
        - locale: zh-CN
          name: 简体中文
          build: false

markdown_extensions:
  - toc:
      permalink: true
  - admonition

extra:
  version: "dev"
