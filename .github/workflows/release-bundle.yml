name: Release Bundle

on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build, upload, and publish.
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-bundle:
    name: Windows Bundle
    if: startsWith(inputs.tag_name || github.event.release.tag_name, 'v')
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
      TARGET_TRIPLE: x86_64-pc-windows-msvc
      ITCH_PROJECT: ${{ vars.ITCH_PROJECT }}
      ITCH_CHANNEL_WINDOWS_EXE: ${{ vars.ITCH_CHANNEL_WINDOWS_EXE }}
      ITCH_CHANNEL_WINDOWS_MSI: ${{ vars.ITCH_CHANNEL_WINDOWS_MSI }}
      BUTLER_API_KEY: ${{ secrets.ITCH_BUTLER_API_KEY }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve Cargo target directories
        id: windows-targets
        shell: pwsh
        run: |
          $targetDir = (& cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          if (-not $targetDir) {
              throw "cargo metadata did not report a target directory"
          }

          $bundleRoot = Join-Path $targetDir "$env:TARGET_TRIPLE/release/bundle"
          $targetDirGlob = $targetDir -replace '\\', '/'

          "TARGET_DIR=$targetDir" >> $env:GITHUB_ENV
          "BUNDLE_ROOT=$bundleRoot" >> $env:GITHUB_ENV
          "BUNDLE_ROOT_GLOB=$targetDirGlob/$env:TARGET_TRIPLE/release/bundle" >> $env:GITHUB_ENV
          "bundle_root_glob=$targetDirGlob/$env:TARGET_TRIPLE/release/bundle" >> $env:GITHUB_OUTPUT

      - name: Install desktop UI dependencies
        shell: bash
        run: npm ci --prefix src-react

      - name: Prepare packaged runtime sidecar
        shell: pwsh
        run: ./scripts/prepare-tauri-sidecar.ps1 -TargetTriple $env:TARGET_TRIPLE -BuildProfile release

      - name: Prepare packaged Butler sidecar
        shell: bash
        run: node ./scripts/prepare-butler-sidecar.mjs --target "$TARGET_TRIPLE"

      - name: Build Windows desktop bundle
        shell: bash
        run: npm exec --yes --package @tauri-apps/cli@^2 -- tauri build --config src-tauri/tauri.release.conf.json --target "$TARGET_TRIPLE" --bundles msi,nsis

      - name: Normalize Windows bundle filenames
        shell: pwsh
        run: |
          $bundleRoot = $env:BUNDLE_ROOT
          if (-not (Test-Path $bundleRoot)) {
            throw "bundle output directory was not found at $bundleRoot"
          }

          $exeAsset = Get-ChildItem -Path $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -eq '.exe' } |
            Select-Object -First 1
          $msiAsset = Get-ChildItem -Path $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -eq '.msi' } |
            Select-Object -First 1

          if (-not $exeAsset) {
            throw "No Windows .exe installer was produced under $bundleRoot"
          }
          if (-not $msiAsset) {
            throw "No Windows .msi installer was produced under $bundleRoot"
          }

          $normalizedExeName = "HandyGamesPublisher.$($env:RELEASE_TAG).exe"
          $normalizedMsiName = "HandyGamesPublisher.$($env:RELEASE_TAG).msi"

          Rename-Item -Path $exeAsset.FullName -NewName $normalizedExeName -Force
          Rename-Item -Path $msiAsset.FullName -NewName $normalizedMsiName -Force

      - name: Generate bundle checksums
        shell: pwsh
        run: |
          $bundleRoot = $env:BUNDLE_ROOT
          if (-not (Test-Path $bundleRoot)) {
              throw "bundle output directory was not found at $bundleRoot"
          }

          $assetFiles = Get-ChildItem -Path $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in @('.msi', '.exe') }

          if (-not $assetFiles) {
              throw "no release assets were produced under $bundleRoot"
          }

          $checksumPath = Join-Path $bundleRoot "SHA256SUMS.txt"
          $checksumLines = foreach ($asset in $assetFiles) {
              $hash = (Get-FileHash -Path $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($asset.Name)"
          }

          Set-Content -Path $checksumPath -Value $checksumLines

      - name: Upload bundle assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.windows-targets.outputs.bundle_root_glob }}/**/*.msi
            ${{ steps.windows-targets.outputs.bundle_root_glob }}/**/*.exe
            ${{ steps.windows-targets.outputs.bundle_root_glob }}/SHA256SUMS.txt

      - name: Validate Itch publish settings
        shell: pwsh
        run: |
          if (-not $env:ITCH_PROJECT) {
              throw "Missing repository variable ITCH_PROJECT (owner/game)."
          }
          if (-not $env:ITCH_CHANNEL_WINDOWS_EXE) {
              throw "Missing repository variable ITCH_CHANNEL_WINDOWS_EXE."
          }
          if (-not $env:ITCH_CHANNEL_WINDOWS_MSI) {
              throw "Missing repository variable ITCH_CHANNEL_WINDOWS_MSI."
          }
          if (-not $env:BUTLER_API_KEY) {
              throw "Missing repository secret ITCH_BUTLER_API_KEY."
          }

      - name: Publish Windows installers to Itch channels
        shell: pwsh
        run: |
          $butlerPath = Join-Path $PWD "src-tauri/bin/hgp-butler-$env:TARGET_TRIPLE.exe"
          if (-not (Test-Path $butlerPath)) {
              throw "Butler sidecar was not found at $butlerPath"
          }

          $bundleRoot = $env:BUNDLE_ROOT
          $exeAsset = Get-ChildItem -Path $bundleRoot -Recurse -File | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          $msiAsset = Get-ChildItem -Path $bundleRoot -Recurse -File | Where-Object { $_.Extension -eq '.msi' } | Select-Object -First 1

          if (-not $exeAsset) {
              throw "No Windows .exe installer was produced under $bundleRoot"
          }
          if (-not $msiAsset) {
              throw "No Windows .msi installer was produced under $bundleRoot"
          }

            & $butlerPath push $exeAsset.FullName "$env:ITCH_PROJECT`:$env:ITCH_CHANNEL_WINDOWS_EXE" --userversion $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
              throw "Butler publish failed for Windows EXE channel."
          }

            & $butlerPath push $msiAsset.FullName "$env:ITCH_PROJECT`:$env:ITCH_CHANNEL_WINDOWS_MSI" --userversion $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
              throw "Butler publish failed for Windows MSI channel."
          }

  linux-bundle:
    name: Linux Bundle
    if: startsWith(inputs.tag_name || github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
      TARGET_TRIPLE: x86_64-unknown-linux-gnu
      ITCH_PROJECT: ${{ vars.ITCH_PROJECT }}
      ITCH_CHANNEL_LINUX: ${{ vars.ITCH_CHANNEL_LINUX }}
      BUTLER_API_KEY: ${{ secrets.ITCH_BUTLER_API_KEY }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install Linux bundle dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: x86_64-unknown-linux-gnu

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve Cargo target directories
        id: linux-targets
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --format-version 1 --no-deps | node -e "const fs = require('fs'); const metadata = JSON.parse(fs.readFileSync(0, 'utf8')); process.stdout.write(metadata.target_directory || '');")"
          if [[ -z "$target_dir" ]]; then
            echo "cargo metadata did not report a target directory" >&2
            exit 1
          fi

          bundle_root="$target_dir/$TARGET_TRIPLE/release/bundle"

          echo "TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "BUNDLE_ROOT=$bundle_root" >> "$GITHUB_ENV"
          echo "BUNDLE_ROOT_GLOB=$bundle_root" >> "$GITHUB_ENV"
          echo "bundle_root_glob=$bundle_root" >> "$GITHUB_OUTPUT"

      - name: Install desktop UI dependencies
        shell: bash
        run: npm ci --prefix src-react

      - name: Prepare packaged runtime sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package runtime-bin --target "$TARGET_TRIPLE"
          mkdir -p src-tauri/bin
          cp "$TARGET_DIR/$TARGET_TRIPLE/release/hgp-runtime" "src-tauri/bin/hgp-runtime-$TARGET_TRIPLE"
          chmod +x "src-tauri/bin/hgp-runtime-$TARGET_TRIPLE"

      - name: Prepare packaged Butler sidecar
        shell: bash
        run: node ./scripts/prepare-butler-sidecar.mjs --target "$TARGET_TRIPLE"

      - name: Build Linux desktop bundle
        shell: bash
        run: npm exec --yes --package @tauri-apps/cli@^2 -- tauri build --config src-tauri/tauri.release.conf.json --target "$TARGET_TRIPLE" --bundles appimage

      - name: Normalize Linux bundle filename
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$BUNDLE_ROOT"
          [[ -d "$bundle_root" ]] || { echo "bundle output directory was not found at $bundle_root" >&2; exit 1; }

          appimage_path="$(find "$bundle_root" -type f -name '*.AppImage' | head -n 1 || true)"
          [[ -n "$appimage_path" ]] || { echo "No AppImage installer was produced under $bundle_root" >&2; exit 1; }

          normalized_path="$(dirname "$appimage_path")/HandyGamesPublisher.${RELEASE_TAG}.AppImage"
          mv -f "$appimage_path" "$normalized_path"

      - name: Generate bundle checksums
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$BUNDLE_ROOT"
          if [[ ! -d "$bundle_root" ]]; then
            echo "bundle output directory was not found at $bundle_root" >&2
            exit 1
          fi

          mapfile -t assets < <(find "$bundle_root" -type f -name '*.AppImage' | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no Linux release assets were produced under $bundle_root" >&2
            exit 1
          fi

          checksum_path="$bundle_root/SHA256SUMS-linux.txt"
          : > "$checksum_path"
          for asset in "${assets[@]}"; do
            sha256sum "$asset" >> "$checksum_path"
          done

      - name: Upload Linux assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.linux-targets.outputs.bundle_root_glob }}/**/*.AppImage
            ${{ steps.linux-targets.outputs.bundle_root_glob }}/SHA256SUMS-linux.txt

      - name: Validate Linux Itch publish settings
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ITCH_PROJECT:-}" ]] || { echo "Missing repository variable ITCH_PROJECT (owner/game)." >&2; exit 1; }
          [[ -n "${ITCH_CHANNEL_LINUX:-}" ]] || { echo "Missing repository variable ITCH_CHANNEL_LINUX." >&2; exit 1; }
          [[ -n "${BUTLER_API_KEY:-}" ]] || { echo "Missing repository secret ITCH_BUTLER_API_KEY." >&2; exit 1; }

      - name: Publish Linux installer to Itch channel
        shell: bash
        run: |
          set -euo pipefail
          butler_path="src-tauri/bin/hgp-butler-$TARGET_TRIPLE"
          [[ -x "$butler_path" ]] || { echo "Butler sidecar not found at $butler_path" >&2; exit 1; }

          bundle_root="$BUNDLE_ROOT"
          appimage_path="$(find "$bundle_root" -type f -name '*.AppImage' | head -n 1 || true)"

          [[ -n "$appimage_path" ]] || { echo "No AppImage installer found for Itch publish." >&2; exit 1; }

          "$butler_path" push "$appimage_path" "$ITCH_PROJECT:$ITCH_CHANNEL_LINUX" --userversion "$RELEASE_TAG"
