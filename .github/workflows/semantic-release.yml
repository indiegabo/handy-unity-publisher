name: Semantic Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(fromJson('["main","alpha","beta"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    outputs:
      is_stale: ${{ steps.release-guard.outputs.is_stale }}
      release_published: ${{ steps.semantic.outputs.new_release_published }}
      release_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout validated branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ github.token }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Guard against stale CI completions
        id: release-guard
        shell: bash
        run: |
          set -euo pipefail

          validated_branch="${{ github.event.workflow_run.head_branch }}"
          validated_sha="${{ github.event.workflow_run.head_sha }}"
          current_branch_sha="$(git rev-parse HEAD)"

          if [[ "$current_branch_sha" != "$validated_sha" ]]; then
            echo "Skipping stale release run for $validated_sha because $validated_branch now points to $current_branch_sha."
            echo "is_stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is_stale=false" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        id: semantic
        if: steps.release-guard.outputs.is_stale == 'false'
        uses: cycjimmy/semantic-release-action@v5
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec@6.0.3
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

  publish-bundles:
    name: Publish Bundles
    needs: semantic-release
    if: >-
      needs.semantic-release.outputs.is_stale == 'false' &&
      needs.semantic-release.outputs.release_published == 'true'
    uses: ./.github/workflows/release-bundle.yml
    with:
      tag_name: ${{ needs.semantic-release.outputs.release_tag }}
    secrets: inherit
