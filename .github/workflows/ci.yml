name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-shape:
    name: Repository Shape
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Reject deprecated build files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t legacy_files < <(
            git ls-files \
              '*.go' \
              'go.mod' \
              'go.sum' \
              'Dockerfile' \
              'Dockerfile.*' \
              'docker-compose.yml' \
              'docker-compose.yaml' \
              'docker-compose.*.yml' \
              'docker-compose.*.yaml'
          )

          if (( ${#legacy_files[@]} > 0 )); then
            printf 'Deprecated build files must not return to the repository:\n' >&2
            printf '  %s\n' "${legacy_files[@]}" >&2
            exit 1
          fi

      - name: Validate HGP identity references
        shell: bash
        run: npm run identity:check

  portable-validation:
    name: Portable Validation (${{ matrix.os }})
    needs: repository-shape
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install desktop UI dependencies
        shell: bash
        run: npm ci --prefix src-react

      - name: Validate synchronized app version
        shell: bash
        run: npm run version:check

      - name: Build desktop UI
        shell: bash
        run: npm run build --prefix src-react

      - name: Compile portable workspace slices
        shell: bash
        run: cargo check --workspace --exclude desktop-shell

      - name: Test portable runtime crates
        shell: bash
        run: |
          cargo test -p runtime-contracts --lib -q
          cargo test -p runtime-config --lib -q
          cargo test -p runtime-core --lib -q
          cargo test -p runtime-manifests --lib -q
          cargo test -p runtime-publish --lib -q
          cargo test -p runtime-git --lib -q
          cargo test -p runtime-runner --lib -q

      - name: Test runtime store process feed slice
        shell: bash
        run: cargo test -p runtime-store process_feed -- --nocapture

  windows-validation:
    name: Windows Validation
    needs: repository-shape
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install desktop UI dependencies
        shell: bash
        run: npm ci --prefix src-react

      - name: Build desktop UI
        shell: bash
        run: npm run build --prefix src-react

      - name: Check formatting
        shell: bash
        run: cargo fmt --all --check

      - name: Compile workspace
        shell: bash
        run: cargo check --workspace

      - name: Test runtime store
        shell: bash
        run: cargo test -p runtime-store -q

      - name: Validate desktop UI build
        shell: bash
        run: npm run build --prefix src-react
