[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/runtime-bin",
    "crates/runtime-config",
    "crates/runtime-core",
    "crates/runtime-git",
    "crates/runtime-manifests",
    "crates/runtime-publish",
    "crates/runtime-runner",
    "crates/runtime-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
version = "0.1.0"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.30"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-notification = { version = "2" }
zip = { version = "2", default-features = false, features = ["deflate"] }
